name: Validate Skills

on:
  push:
    paths:
      - ".claude/skills/**/SKILL.md"
  pull_request:
    paths:
      - ".claude/skills/**/SKILL.md"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate SKILL.md frontmatter
        run: bash .claude/skills/skill-best-practices/scripts/validate-skills.sh
